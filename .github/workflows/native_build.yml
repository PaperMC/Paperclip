name: Build Native
on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.get_date.outputs.date }}
    steps:
      - name: Generate build date
        id: get_date
        run: echo "date=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    defaults:
      run:
        working-directory: ./native
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux (aarch64)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      CI_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: dnf install -y gcc gcc-c++ make openssl-devel libcurl-devel pkgconf-pkg-config git
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: paperclip-${{ matrix.target }}
          path: native/target/${{ matrix.target }}/release/paperclip

  build-native:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./native
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            extension: ""
          # macOS (aarch64)
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
          # Windows (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"
          # Windows (aarch64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            extension: ".exe"
    env:
      CI_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: paperclip-${{ matrix.target }}
          path: native/target/${{ matrix.target }}/release/paperclip${{ matrix.extension }}
