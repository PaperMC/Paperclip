[package]
name = "paperclip"
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = false
opt-level = 3
lto = true
codegen-units = 1

[target.aarch64-unknown-linux-gnu]
dockerfile = "cross/aarch64-linux-unknown-musl.Dockerfile"

[dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
java-locator = "0.1.9"
qbsdiff = "1.4.4"

nyquest = { version = "0.4.0", features = ["blocking-stream"] }
nyquest-preset = { version = "0.4.0", features = ["blocking-stream"] }
sha2 = "0.11.0"
digest-io = "0.1.0"
thiserror = "2.0.19"
zip = "8.6.0"
hex = "0.4.3"

serde = { version = "1.0.229", features = ["derive"] }
postcard = "1.1.3"

indoc = "2.0.7"

[target.'cfg(target_os = "linux")'.dependencies]
nyquest-backend-curl = { version = "0.4.1", features = ["blocking-stream", "ssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[build-dependencies]
chrono = { version = "0.4.45", features = ["now"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.33"
